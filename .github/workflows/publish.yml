name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish when this version is absent
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "figma-lens@$VERSION" version >/dev/null 2>&1; then
            echo "figma-lens@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi
